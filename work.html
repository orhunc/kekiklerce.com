<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Work — Olympia Bukkakis</title>
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: #000;
      color: #fff;
      font-family: 'Courier New', Courier, monospace;
      min-height: 100vh;
    }

    /* ── TOP BAR ── */
    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 2rem 2.5rem;
      position: sticky;
      top: 0;
      background: #000;
      z-index: 10;
      border-bottom: 1px solid #111;
    }

    .topbar__home {
      color: #fff;
      text-decoration: none;
      font-size: 1rem;
      font-weight: 700;
      letter-spacing: 0.02em;
      transition: opacity 0.2s;
    }

    .topbar__home:hover { opacity: 0.5; }

    .topbar__back {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      color: #fff;
      text-decoration: none;
      font-size: 0.78rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      transition: opacity 0.2s;
    }

    .topbar__back:hover { opacity: 0.5; }

    .topbar__back svg { display: block; }

    /* ── HERO IMAGE ── */
    .work-hero {
      width: 100%;
      max-height: 70vh;
      object-fit: cover;
      display: block;
    }

    .work-hero-placeholder {
      width: 100%;
      height: 60vh;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #333;
      font-size: 0.8rem;
      letter-spacing: 0.1em;
    }

    /* ── CONTENT ── */
    .work-body {
      max-width: 820px;
      margin: 0 auto;
      padding: 3rem 2.5rem 6rem;
      animation: fadeUp 0.7s ease both;
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(20px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .work-body__title {
      font-size: clamp(1.8rem, 4vw, 2.8rem);
      font-weight: 400;
      margin-bottom: 0.4rem;
    }

    .work-body__title em { font-style: italic; }

    .work-body__date {
      font-size: 0.85rem;
      color: #666;
      letter-spacing: 0.08em;
      margin-bottom: 2.5rem;
    }

    .work-body__desc {
      font-size: 1rem;
      line-height: 1.9;
      color: #ccc;
      margin-bottom: 2rem;
    }

    .work-body__desc p + p { margin-top: 1.2rem; }

    /* ── DETAILS GRID ── */
    .work-details {
      display: grid;
      grid-template-columns: 140px 1fr;
      gap: 0.6rem 1.5rem;
      border-top: 1px solid #1e1e1e;
      padding-top: 2rem;
      margin-top: 2rem;
      font-size: 0.88rem;
    }

    .work-details__label {
      color: #555;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      font-size: 0.72rem;
      padding-top: 0.1rem;
    }

    .work-details__value {
      color: #ccc;
      line-height: 1.6;
    }

    /* ── EXTRA IMAGES ── */
    .work-images {
      margin-top: 4rem;
      display: flex;
      flex-direction: column;
      gap: 1.5rem;
    }

    .work-images__img {
      width: 100%;
      object-fit: cover;
      display: block;
    }

    .work-images__placeholder {
      width: 100%;
      aspect-ratio: 16 / 9;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #2a2a2a;
      font-size: 0.75rem;
      letter-spacing: 0.1em;
    }

    /* ── NAV BETWEEN WORKS ── */
    .work-nav {
      display: flex;
      justify-content: space-between;
      border-top: 1px solid #1e1e1e;
      margin-top: 4rem;
      padding-top: 1.5rem;
      gap: 1rem;
    }

    .work-nav a {
      color: #fff;
      text-decoration: none;
      font-size: 0.8rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      opacity: 0.5;
      transition: opacity 0.2s;
    }

    .work-nav a:hover { opacity: 1; }
    .work-nav a:first-child { text-align: left; }
    .work-nav a:last-child  { text-align: right; }

    /* ── NOT FOUND ── */
    .not-found {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 60vh;
      gap: 1rem;
      color: #444;
      font-size: 0.9rem;
      letter-spacing: 0.05em;
    }

    .not-found a {
      color: #fff;
      text-decoration: underline;
      text-underline-offset: 4px;
    }

    @media (max-width: 600px) {
      .topbar { padding: 1.2rem; }
      .work-body { padding: 2rem 1.2rem 5rem; }
      .work-details { grid-template-columns: 110px 1fr; }
    }
  </style>
</head>
<body>

  <!-- TOP BAR -->
  <header class="topbar">
    <a class="topbar__home" href="index.html">Olympia Bukkakis</a>
    <a class="topbar__back" href="index.html#work">
      <svg width="14" height="14" viewBox="0 0 14 14" fill="none">
        <line x1="12" y1="7" x2="2" y2="7" stroke="white" stroke-width="1.4"/>
        <polyline points="6,2 1,7 6,12" stroke="white" stroke-width="1.4" fill="none"/>
      </svg>
      All work
    </a>
  </header>

  <!-- CONTENT injected by JS -->
  <div id="page"></div>

  <script>
    /* ── DATA ───────────────────────────────────────────────
       Add as many works as you like here.
       For images: replace the `images` arrays with real URLs.
       hero: the big top image
       images: additional images below the text
    ──────────────────────────────────────────────────────── */
    var WORKS = {
      replay: {
        title:    'replay',
        date:     'February 2023',
        venue:    'Sophiensaele, Berlin',
        duration: '70 minutes',
        credits:  'Created and performed by Olympia Bukkakis, N.N., N.N.',
        hero:     null,   // replace with 'images/replay-hero.jpg'
        heroBg:   'linear-gradient(135deg,#1a1a1a,#2e2e2e)',
        images:   [null, null],  // replace with real image URLs
        imageBgs: [
          'linear-gradient(135deg,#111,#222)',
          'linear-gradient(135deg,#0d0d0d,#1a1a1a)'
        ],
        body: [
          'A 70 minute trio drawing from drag, classical music, and Britney moves to explore sound and movement in different cultural spaces. Originally performed at Sophiensaele in Berlin.',
          'The work stages the body as an archive — a site where pop choreography, operatic gesture, and queer drag tradition collide and bleed into one another. Three performers navigate a shifting score of repetition, exhaustion, and ecstasy.',
          'replay asks: what does it mean to do something again? To quote, to cover, to remember with the body? And at what point does repetition become transformation?'
        ],
        prev: null,
        next: { id: 'canzone', label: 'Canzone' }
      },

      canzone: {
        title:    'Canzone',
        date:     'November 2021',
        venue:    'Toured: Vienna, Amsterdam, London',
        duration: '55 minutes',
        credits:  'Created and performed by Olympia Bukkakis',
        hero:     null,
        heroBg:   'linear-gradient(135deg,#1a0d0d,#2e1a0a)',
        images:   [null, null],
        imageBgs: [
          'linear-gradient(135deg,#150808,#200f0f)',
          'linear-gradient(135deg,#0f0800,#1a1000)'
        ],
        body: [
          'A chamber cabaret for three voices and electronics exploring the voice as a site of gender, grief, and ecstasy.',
          'Canzone draws on the Italian art song tradition — a form built on yearning — and routes it through drag performance, queer club culture, and personal testimony. The result is something between a concert, a séance, and a confessional.',
          'The work toured to Vienna, Amsterdam, and London, playing in opera houses, art spaces, and queer venues — each context reshaping what the songs mean and who they are for.'
        ],
        prev: { id: 'replay', label: 'replay' },
        next: { id: 'pageant', label: 'Pageant' }
      },

      pageant: {
        title:    'Pageant',
        date:     'October 2019',
        venue:    'Volksbühne, Berlin',
        duration: '90 minutes',
        credits:  'Created and performed by Olympia Bukkakis and ensemble',
        hero:     null,
        heroBg:   'linear-gradient(135deg,#0d0a00,#1a1400)',
        images:   [null, null],
        imageBgs: [
          'linear-gradient(135deg,#0a0800,#151200)',
          'linear-gradient(135deg,#0d0b00,#1a1600)'
        ],
        body: [
          'An ensemble work for five performers and live band, reimagining the beauty pageant as a form of collective mourning and celebration.',
          'Pageant takes the structure of a competition — the walk, the talent round, the question, the crowning — and floods it with grief, camp, and political fury. It asks what women, queers, and outsiders have always been asked to perform, and at what cost.',
          'Originally performed at Volksbühne Berlin, the work was subsequently restaged in Brussels and Zagreb.'
        ],
        prev: { id: 'canzone', label: 'Canzone' },
        next: null
      }
    };

    /* ── RENDER ─────────────────────────────────────────── */
    var id   = new URLSearchParams(window.location.search).get('id');
    var work = WORKS[id];
    var page = document.getElementById('page');

    if (!work) {
      page.innerHTML =
        '<div class="not-found">' +
          '<p>Work not found.</p>' +
          '<a href="index.html#work">← Back to all work</a>' +
        '</div>';
    } else {
      document.title = work.title + ' — Olympia Bukkakis';

      /* hero */
      var heroHTML = work.hero
        ? '<img class="work-hero" src="' + work.hero + '" alt="' + work.title + '" />'
        : '<div class="work-hero-placeholder" style="background:' + work.heroBg + ';">' +
            '<span>[ image: ' + work.title + ' ]</span>' +
          '</div>';

      /* body paragraphs */
      var bodyHTML = work.body.map(function (p) {
        return '<p>' + p + '</p>';
      }).join('');

      /* extra images */
      var imagesHTML = work.images.map(function (src, i) {
        if (src) {
          return '<img class="work-images__img" src="' + src + '" alt="' + work.title + ' ' + (i+1) + '" />';
        }
        return '<div class="work-images__placeholder" style="background:' + work.imageBgs[i] + ';">' +
                 '<span>[ image ' + (i+1) + ' ]</span>' +
               '</div>';
      }).join('');

      /* prev / next */
      var prevHTML = work.prev
        ? '<a href="work.html?id=' + work.prev.id + '">← ' + work.prev.label + '</a>'
        : '<span></span>';
      var nextHTML = work.next
        ? '<a href="work.html?id=' + work.next.id + '">' + work.next.label + ' →</a>'
        : '<span></span>';

      page.innerHTML =
        heroHTML +
        '<div class="work-body">' +
          '<h1 class="work-body__title"><em>' + work.title + '</em></h1>' +
          '<p class="work-body__date">' + work.date + '</p>' +
          '<div class="work-body__desc">' + bodyHTML + '</div>' +
          '<dl class="work-details">' +
            '<dt class="work-details__label">Venue</dt>'    +
            '<dd class="work-details__value">' + work.venue    + '</dd>' +
            '<dt class="work-details__label">Duration</dt>' +
            '<dd class="work-details__value">' + work.duration + '</dd>' +
            '<dt class="work-details__label">Credits</dt>'  +
            '<dd class="work-details__value">' + work.credits  + '</dd>' +
          '</dl>' +
          '<div class="work-images">' + imagesHTML + '</div>' +
          '<nav class="work-nav">' + prevHTML + nextHTML + '</nav>' +
        '</div>';
    }
  </script>
</body>
</html>
